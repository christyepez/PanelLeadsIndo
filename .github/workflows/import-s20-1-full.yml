name: Import S20.1 Full Project

on:
  push:
    branches:
      - release/s20.1-full
    paths:
      - '.github/s20_1_payload.part*'
      - '.github/workflows/import-s20-1-full.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: release/s20.1-full
          fetch-depth: 0

      - name: Check complete payload
        id: payload
        shell: bash
        run: |
          count=$(find .github -maxdepth 1 -name 's20_1_payload.part*' | wc -l)
          if [ "$count" -eq 6 ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Waiting for all 6 binary payload parts; currently: $count"
          fi

      - name: Assemble and extract S20.1
        if: steps.payload.outputs.exists == 'true'
        shell: bash
        run: |
          cat .github/s20_1_payload.part* > /tmp/s20_1.tar.xz
          rm -f .github/s20_1_payload.part*
          tar -xJf /tmp/s20_1.tar.xz -C .
          rm -f /tmp/s20_1.tar.xz

      - name: Validate required PBIP artifacts
        if: steps.payload.outputs.exists == 'true'
        shell: bash
        run: |
          test -f pnl_Leads_MKT.pbip
          test -f pnl_Leads_MKT.Report/definition.pbir
          test -f pnl_Leads_MKT.SemanticModel/definition.pbism
          test -f pnl_Leads_MKT.SemanticModel/definition/model.tmdl
          test -f scripts/Validate-PBIP.ps1
          test -f .github/workflows/validate-pbip.yml
          count=$(find . -type f | wc -l)
          echo "S20.1 required artifacts OK; files in checkout: $count"

      - name: Commit full S20.1 project
        if: steps.payload.outputs.exists == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "release: import complete S20.1 PBIP project"
          git push origin HEAD:release/s20.1-full
