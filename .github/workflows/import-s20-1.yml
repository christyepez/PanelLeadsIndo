name: Import S20.1 Full Project

on:
  push:
    branches:
      - release/s20.1-clean
    paths:
      - '.github/s20_1_payload.part*'
      - '.github/workflows/import-s20-1.yml'
      - '.github/import-trigger.txt'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: release/s20.1-clean
          fetch-depth: 0

      - name: Assemble payload
        shell: bash
        run: |
          cat .github/s20_1_payload.part* > /tmp/s20_1.tar.xz
          rm -f .github/s20_1_payload.part*
          rm -f .github/import-trigger.txt
          rm -f .github/workflows/import-s20-1.yml

      - name: Extract S20.1
        shell: bash
        run: |
          tar -xJf /tmp/s20_1.tar.xz -C .
          rm -f /tmp/s20_1.tar.xz

      - name: Validate required artifacts
        shell: bash
        run: |
          test -f pnl_Leads_MKT.pbip
          test -f pnl_Leads_MKT.Report/definition.pbir
          test -f pnl_Leads_MKT.SemanticModel/definition.pbism
          test -f pnl_Leads_MKT.SemanticModel/definition/model.tmdl
          test -f pnl_Leads_MKT.SemanticModel/definition/relationships.tmdl
          test -f scripts/Validate-PBIP.ps1
          test -f .github/workflows/validate-pbip.yml

      - name: Commit complete S20.1
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "release: import complete S20.1 PBIP project"
          git push origin HEAD:release/s20.1-clean
