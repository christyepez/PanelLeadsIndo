name: Import S20.1 Full Project

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  import:
    if: github.head_ref == 'release/s20.1-clean'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release/s20.1-clean
          fetch-depth: 0

      - name: Detect payload
        id: payload
        shell: bash
        run: |
          count=$(find .github -maxdepth 1 -name 's20_1_payload.part*' | wc -l)
          if [ "$count" -eq 6 ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Payload already imported or incomplete; fragments: $count"
          fi

      - name: Assemble payload
        if: steps.payload.outputs.exists == 'true'
        shell: bash
        run: |
          cat .github/s20_1_payload.part* > /tmp/s20_1.tar.xz
          rm -f .github/s20_1_payload.part*
          rm -f .github/workflows/import-s20-1.yml

      - name: Extract S20.1
        if: steps.payload.outputs.exists == 'true'
        shell: bash
        run: |
          tar -xJf /tmp/s20_1.tar.xz -C .
          rm -f /tmp/s20_1.tar.xz

      - name: Validate required artifacts
        if: steps.payload.outputs.exists == 'true'
        shell: bash
        run: |
          test -f pnl_Leads_MKT.pbip
          test -f pnl_Leads_MKT.Report/definition.pbir
          test -f pnl_Leads_MKT.SemanticModel/definition.pbism
          test -f pnl_Leads_MKT.SemanticModel/definition/model.tmdl
          test -f pnl_Leads_MKT.SemanticModel/definition/relationships.tmdl
          test -f scripts/Validate-PBIP.ps1
          test -f .github/workflows/validate-pbip.yml
          count=$(find . -type f | wc -l)
          echo "S20.1 files in checkout: $count"

      - name: Commit complete S20.1
        if: steps.payload.outputs.exists == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "release: import complete S20.1 PBIP project"
          git push origin HEAD:release/s20.1-clean
